<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#0d1b3a" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1.5" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseAnim {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }

      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }

      @keyframes flowLight {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes beamRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .pulse-bg {
        animation: pulseAnim 6s ease-in-out infinite;
        transform-origin: center;
      }

      .floating-pill-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }

      .floating-pill-2 {
        animation: floatReverse 6s ease-in-out infinite 0.5s;
      }

      .floating-pill-3 {
        animation: floatSlow 7s ease-in-out infinite 1s;
      }

      .flowing-line {
        stroke-dasharray: 20, 180;
        animation: flowLight 4s linear infinite;
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 1.5px;
      }

      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.4px;
      }

      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Pulsing Glow Orbs (Behind Everything) -->
  <circle cx="240" cy="140" r="260" fill="url(#glowPulse)" class="pulse-bg" />
  <circle cx="980" cy="280" r="280" fill="url(#glowPulse)" class="pulse-bg" style="animation-delay: -3s;" />
  <circle cx="600" cy="210" r="200" fill="url(#redGlow)" class="pulse-bg" style="animation-delay: -1.5s;" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Animated Light Paths (Background Depth) -->
  <g opacity="0.6">
    <path d="M 0 110 Q 300 170 600 110 T 1200 110" fill="none" stroke="url(#primaryGrad)" stroke-width="2" class="flowing-line" />
    <path d="M 0 310 Q 300 250 600 310 T 1200 310" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" class="flowing-line" style="animation-duration: 6s; animation-direction: reverse;" />
  </g>

  <!-- Left Side Visual Element: Interactive PDF Canvas Blueprint -->
  <g transform="translate(70, 75)" opacity="0.95" class="floating-pill-1">
    <!-- Back PDF Page Blueprint -->
    <rect x="0" y="0" width="160" height="210" rx="10" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <path d="M 120 0 L 160 40 L 120 40 Z" fill="rgba(56, 189, 248, 0.25)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    
    <!-- PDF Badge Icon -->
    <rect x="18" y="22" width="46" height="22" rx="4" fill="url(#accentGrad)" />
    <text x="41" y="37" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">PDF</text>
    
    <!-- Document Lines (Abstract Content) -->
    <rect x="18" y="60" width="124" height="6" rx="3" fill="rgba(255, 255, 255, 0.2)" />
    <rect x="18" y="78" width="100" height="6" rx="3" fill="rgba(255, 255, 255, 0.2)" />
    <rect x="18" y="96" width="115" height="6" rx="3" fill="rgba(255, 255, 255, 0.2)" />
    
    <!-- Render Highlight / Annotation Layer -->
    <rect x="18" y="118" width="90" height="18" rx="4" fill="rgba(251, 191, 36, 0.25)" stroke="#fbbf24" stroke-dasharray="2,2" stroke-width="1" />
    <text x="24" y="131" font-family="monospace" font-size="9" fill="#fde68a">&lt;canvas:2d&gt;</text>
    
    <rect x="18" y="148" width="124" height="22" rx="5" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="30" cy="159" r="4" fill="#38bdf8" />
    <text x="42" y="163" font-family="monospace" font-size="10" fill="#bae6fd">wasm_render()</text>
    
    <!-- Signature Line Mock -->
    <path d="M 22 192 C 40 185 60 198 80 188 C 100 178 120 195 140 186" fill="none" stroke="#f43f5e" stroke-width="2" />
  </g>

  <!-- Central / Foreground Content (Carefully Kept Front and Unobscured) -->
  <g transform="translate(320, 105)">
    <!-- Top Ecosystem Micro Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <circle cx="15" cy="15" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="20" class="tag-text" fill="#7dd3fc">BROWSER-NATIVE &amp; WASM ENGINES</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" class="title-text" font-size="44" fill="#ffffff">
      AWESOME WEB PDF
    </text>
    <text x="0" y="130" class="title-text" font-size="44" fill="url(#primaryGrad)" filter="url(#neonFilter)">
      RENDERING API
    </text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle-text" font-size="18" fill="#cbd5e1">
      Curated Catalog of SaaS Platforms, WASM Viewers &amp; Self-Hosted Annotation Layers
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 205)">
      <!-- Pill 1: Canvas & SVG -->
      <g class="floating-pill-1">
        <rect x="0" y="0" width="155" height="36" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
        <text x="77" y="23" class="tag-text" fill="#e2e8f0" text-anchor="middle">⚡ Canvas &amp; SVG</text>
      </g>
      
      <!-- Pill 2: WASM Powered -->
      <g transform="translate(170, 0)" class="floating-pill-2">
        <rect x="0" y="0" width="165" height="36" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.2" />
        <text x="82" y="23" class="tag-text" fill="#e2e8f0" text-anchor="middle">🦀 WebAssembly</text>
      </g>
      
      <!-- Pill 3: Annotation Layer -->
      <g transform="translate(350, 0)" class="floating-pill-3">
        <rect x="0" y="0" width="175" height="36" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.2" />
        <text x="87" y="23" class="tag-text" fill="#e2e8f0" text-anchor="middle">✏️ Forms &amp; Markup</text>
      </g>
      
      <!-- Pill 4: Zero Server Overhead -->
      <g transform="translate(540, 0)" class="floating-pill-1">
        <rect x="0" y="0" width="180" height="36" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1.2" />
        <text x="90" y="23" class="tag-text" fill="#e2e8f0" text-anchor="middle">🔒 Zero-Server Privacy</text>
      </g>
    </g>
  </g>

  <!-- Outer Border Glow -->
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />
</svg>
